name: EnvironmentCard
type: TouchStripCard
version: 1
layout: layout.svg

bindings:
  date:
    type: text
    node: date
    default: ""
    max_width: 190
    overflow: ellipsis

  time:
    type: text
    node: time
    default: ""
    max_width: 190
    overflow: clip

  temperature:
    type: text
    node: temperature
    default: ""
    max_width: 50
    overflow: clip

  humidity:
    type: text
    node: humidity
    default: ""
    max_width: 50
    overflow: clip

  deck_brightness:
    type: range
    node: deck_brightness
    default: 0.5
    direction: horizontal

events:
  - name: brightness_down
    source: encoder_turn
    direction: left

  - name: brightness_up
    source: encoder_turn
    direction: right

regions:
  card:
    x: 0
    y: 0
    width: 197
    height: 98
    events: []
